name: Release

# Push a tag to release the desktop apps:
#   git tag v0.1.0 && git push github v0.1.0
#
# Desktop bundles are built by tauri-apps/tauri-action on a runner per OS and
# attached to one draft release, published once every build has succeeded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: Leave the release as a draft
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=$(jq -r .expo.version app.json)" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with a manifest ships a build whose in-app version
      # is not the one people downloaded.
      - name: Manifests agree with the tag
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          [ "$TAG" = "v$V" ] || [ "${{ github.event_name }}" = workflow_dispatch ] \
            || { echo "tag $TAG does not match app.json $V" >&2; exit 1; }
          for pair in package.json:.version src-tauri/tauri.conf.json:.version; do
            found=$(jq -r "${pair#*:}" "${pair%%:*}")
            [ "$found" = "$V" ] || { echo "${pair%%:*} is $found, expected $V" >&2; exit 1; }
          done
          grep -q "^version = \"$V\"" src-tauri/Cargo.toml \
            || { echo "src-tauri/Cargo.toml is not $V" >&2; exit 1; }

      # Created once so every job attaches to the same release.
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # Looking a release up by tag never finds a draft.
          id=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" -f name="Statim ${{ steps.version.outputs.version }}" \
              -F draft=true -F prerelease=false --jq .id)
          fi
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "no release id: $id" >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary on macOS: libtdjson.dylib already carries both
          # architectures, so two per-arch builds would gain nothing.
          - os: macos-15
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26
        if: matrix.os == 'macos-15'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # Tauri's own prerequisites, plus cmake for aws-lc (matrix-sdk), perl for
      # OpenSSL (SQLCipher) and libudev for hidapi (Ledger).
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake perl libudev-dev

      # OpenSSL's assembly needs it; MSVC and cmake are already on the image.
      - name: Windows dependencies
        if: matrix.os == 'windows-latest'
        run: choco install nasm --no-progress -y

      - run: npm ci

      # macOS builds it from Swiftgram's xcframework, about 360 MB once; Linux
      # and Windows download the same TDLib version already built.
      - name: Cache TDLib
        uses: actions/cache@v4
        with:
          path: src-tauri/frameworks
          key: tdlib-${{ matrix.os }}-${{ hashFiles('scripts/tdlib.sh') }}
      - name: TDLib
        shell: bash
        run: ./scripts/tdlib.sh desktop

      - name: Apple signing
        if: matrix.os == 'macos-15'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ] \
            || { echo "The Apple signing secrets are not set." >&2; exit 1; }
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts an installed copy verifies before applying.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Writes and merges latest.json across the matrix; installed copies read it.
          uploadUpdaterJson: true

      # `gh attestation verify <file> --repo alaibe/statim` checks any download.
      - uses: actions/attest@v4
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe

  publish:
    needs: [prepare, desktop]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && !inputs.draft }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE="repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}"
          mkdir sums && cd sums
          gh api "$RELEASE/assets" --paginate \
            --jq '.[] | select(.name | test("\\.(sig|json)$|^SHA256SUMS$") | not) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$id" > "$name"
            done
          sha256sum -- * > SHA256SUMS
          gh api -X POST -H "Content-Type: text/plain" --input SHA256SUMS --silent \
            "https://uploads.github.com/$RELEASE/assets?name=SHA256SUMS"
          gh api -X PATCH "$RELEASE" -F draft=false --silent
          gh workflow run site.yml --repo "${{ github.repository }}" --ref main

  homebrew:
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          V="${{ needs.prepare.outputs.version }}"
          DMG="Statim_${V}_universal.dmg"
          curl -fsSL -o "$DMG" "https://github.com/${{ github.repository }}/releases/download/v$V/$DMG"
          SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          gh repo clone alaibe/homebrew-tap tap -- --depth 1
          sed -i -E "s/^  version \".*\"/  version \"$V\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" tap/Casks/statim.rb
          gh auth setup-git
          git -C tap -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -am "statim $V"
          git -C tap push

  aur:
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          [ -n "$AUR_SSH_PRIVATE_KEY" ] || { echo "No AUR key yet; statim-bin stays as it is."; exit 0; }
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/statim-bin.git aur
          sed -i -E "s/^pkgver=.*/pkgver=$V/; s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          docker run --rm -v "$PWD/aur:/pkg" -e OWNER="$(id -u):$(id -g)" archlinux:latest bash -c '
            set -e
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            pacman -Sy --noconfirm --needed pacman-contrib >/dev/null
            useradd -m b && chown -R b /pkg && cd /pkg
            su b -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
            chown -R "$OWNER" /pkg'
          git -C aur -c user.name="Anthony Laibe" -c user.email="anthony@laibe.cc" commit -am "statim $V"
          git -C aur push

