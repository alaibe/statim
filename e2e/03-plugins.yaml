# Enables a plugin, uses its chat, and disables it again.
appId: im.statim.app
---
- runFlow: lib/open-status-chat.yaml

- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: "/enable markets"

- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "chat-local-markets"
    timeout: 15000

- tapOn:
    id: "chat-local-markets"
- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: "/alerts"
- extendedWaitUntil:
    visible: "alert.*"
    timeout: 15000

- tapOn: "Back"
- openLink: "statim://chat/local-status"
- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: "/disable markets"
- tapOn: "Back"
- assertNotVisible:
    id: "chat-local-markets"
