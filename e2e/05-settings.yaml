# Opens settings screens and verifies account erasure requires confirmation.
appId: im.statim.app
---
- runFlow: lib/launch.yaml
- tapOn: "Settings"

- tapOn:
    id: "settings-accounts"
- assertVisible: "Create a new account"
- runFlow: lib/back.yaml

- scrollUntilVisible:
    element:
      id: "settings-plugins"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-plugins"
- assertVisible:
    id: "plugin-wallet"
- runFlow: lib/back.yaml

- scrollUntilVisible:
    element:
      id: "settings-erase-account"
    direction: UP
    centerElement: true
- tapOn:
    id: "settings-erase-account"
- assertVisible: "Erase this account?"
- tapOn: "Cancel"
- assertVisible:
    id: "settings-erase-account"
