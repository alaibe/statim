# Runs commands from a quick action and from the composer.
appId: im.statim.app
---
- runFlow: lib/open-status-chat.yaml

- tapOn:
    id: "quick-plugins"
- extendedWaitUntil:
    visible: "Plugins"
    timeout: 15000

- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: "/whoami"
- extendedWaitUntil:
    visible: "Your address"
    timeout: 15000

- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: "/nonsense"
- extendedWaitUntil:
    visible: "Unknown slash command.*"
    timeout: 10000
