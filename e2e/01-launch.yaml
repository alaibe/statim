# Launches and checks the Statim chat navigation used by later flows.
appId: im.statim.app
---
- runFlow: lib/launch.yaml
- assertVisible:
    id: "chat-local-status"
- assertVisible:
    id: "header-new-chat"

- openLink: "statim://chat/local-status"
# A freshly erased simulator asks before opening a custom scheme the first time.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- assertVisible:
    id: "chat-header-local-status"
- assertVisible:
    id: "composer-input"
- tapOn: "Back"
- assertVisible:
    id: "chat-local-status"
