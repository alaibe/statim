# Opens a bookmark in the system browser and comes back with the composer free again.
appId: im.statim.app
tags:
  - ios-only
---
- runFlow: lib/launch.yaml
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "statim://chat/local-browser"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 15000

- tapOn:
    id: "composer-input"
- eraseText: 200
- inputText: "/open uniswap"
- tapOn:
    id: "composer-send"
- runFlow: lib/expect-safari-uniswap.yaml
- extendedWaitUntil:
    visible: "Opening Uniswap.*"
    timeout: 10000
- assertNotVisible: "Running /open.*"

# The same through a widget row's action sheet, which has to finish closing
# before anything else can be presented.
- tapOn:
    id: "quick-bookmarks"
- extendedWaitUntil:
    visible: "Aave.*"
    timeout: 15000
# The composer keeps the focus from /open. On a simulator that types with its
# on-screen keyboard rather than the Mac's, the keyboard leaves the new list's
# first rows above the chat's visible part; dragging the chat down shows them.
- swipe:
    start: 50%, 20%
    end: 50%, 40%
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Aave.*"
- extendedWaitUntil:
    visible: "Open Aave"
    timeout: 5000
- tapOn: "Open Aave"
- runFlow: lib/expect-safari-aave.yaml
- assertNotVisible: "Running /open.*"
- tapOn:
    id: "composer-input"
- inputText: "hello"
- assertVisible:
    id: "composer-send"
- eraseText: 10
- tapOn: "Back"
