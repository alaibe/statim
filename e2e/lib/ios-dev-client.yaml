# Loads the dev build so later launchApps reopen it; a new simulator asks to open it, then shows the dev menu.
appId: im.statim.app
---
- openLink: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Talk freely.|Chats|Fast refresh"
    timeout: 120000
- runFlow:
    when:
      visible: "Fast refresh"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Talk freely.|Chats"
    timeout: 30000
