# Taps this run's Metro only after 30 s: the dev client's server list can stick, but also flashes on launch.
appId: im.statim.app
---
- launchApp
- extendedWaitUntil:
    visible: "Talk freely.|Chats"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn:
          text: "http://.+:${METRO_PORT}"
          optional: true
