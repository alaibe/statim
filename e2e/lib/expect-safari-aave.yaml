# Safari is in front with Aave loaded, then the app comes back to the front.
appId: com.apple.mobilesafari
---
- extendedWaitUntil:
    visible: "Aave.*|View Bookmarks, Share Menu, and Open Tabs"
    timeout: 30000
- runFlow: safari-tip.yaml
- extendedWaitUntil:
    visible: "Aave.*"
    timeout: 30000
- openLink: "statim://chat/local-browser"
