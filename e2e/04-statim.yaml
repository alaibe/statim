# Verifies local Statim messages survive navigation and relaunch.
appId: im.statim.app
---
- evalScript: ${output.note = 'ridge-trip-' + new Date().getTime().toString()}
- runFlow: lib/open-statim-chat.yaml
- assertVisible:
    id: "chat-header-local-statim"
- assertNotVisible: ${output.note}

- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: ${output.note}
- extendedWaitUntil:
    visible: ${output.note}
    timeout: 10000

- tapOn: "Back"
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "statim://chat/local-statim"
- assertVisible:
    id: "chat-header-local-statim"
- extendedWaitUntil:
    visible: ${output.note}
    timeout: 10000

- runFlow: lib/open-statim-chat.yaml
- assertVisible:
    id: "chat-header-local-statim"
- extendedWaitUntil:
    visible: ${output.note}
    timeout: 15000
