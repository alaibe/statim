# Creates the account required by later flows after a fresh reset.
appId: im.statim.app
---
- launchApp
- extendedWaitUntil:
    visible: "Talk freely.|Chats"
    timeout: 60000

- runFlow:
    when:
      visible: "Talk freely."
    commands:
      - tapOn: "Create an account"

      - tapOn: "Reveal recovery phrase"
      - tapOn: "I've written it down"

- extendedWaitUntil:
    visible:
      id: "chat-local-statim"
    timeout: 60000
