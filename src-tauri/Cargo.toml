[package]
name = "statim"
version = "0.7.1"
description = "A self-custodial messenger."
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "statim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["updater", "homeserver"]
# Off for the Mac App Store build, which may not update itself.
updater = ["dep:tauri-plugin-updater"]
# Off for the Mac App Store build, which may not run programs it downloads.
homeserver = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-http = "~2.6"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "~2.5"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = "~2.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.22"
ledger-transport-hid = "0.11"
ledger-apdu = "0.11"
libloading = "0.8"
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "rustls-aws-lc-rs"] }
matrix-sdk-ui = { version = "0.19", default-features = false, features = ["rustls-aws-lc-rs"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
sha2 = "0.10"
# Routes matrix-sdk's tracing into the app log.
tracing = { version = "0.1", features = ["log"] }
mime = "0.3"
dirs = "6"
rpassword = "7"
interprocess = "2"
ruzstd = "0.8.2"

# SQLCipher from source. macOS gets CommonCrypto; everything else compiles its
# own OpenSSL so the build has no system dependency.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-contacts = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSEnumerator", "NSError", "NSObject", "NSProcessInfo", "NSString"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

# Apple Intelligence runs on Apple silicon only. A fork until blacktop/fm-rs#5 ships.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fm-rs = { git = "https://github.com/alaibe/fm-rs", rev = "5240022cb6432597a57329467470a11eff2be099" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
