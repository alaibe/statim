name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASES_REPOSITORY: alaibe/statim
  # gh talks to GitHub, not to the Forgejo the job runs for.
  GH_HOST: github.com
  GH_VERSION: 2.104.0
  GH_SHA256: 98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e

jobs:
  prepare:
    runs-on: home-linux
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Secrets are set
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: '[ -n "$RELEASES_TOKEN" ] || { echo "The RELEASES_TOKEN secret is not set." >&2; exit 1; }'

      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: gh
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1

      - id: version
        name: Version files agree with the tag
        run: |
          V=$(jq -r .expo.version app.json)
          case "${{ github.ref }}" in
            refs/tags/*) [ "${{ github.ref_name }}" = "v$V" ] || { echo "tag ${{ github.ref_name }} does not match app.json $V" >&2; exit 1; } ;;
          esac
          for pair in package.json:.version src-tauri/tauri.conf.json:.version; do
            found=$(jq -r "${pair#*:}" "${pair%%:*}")
            [ "$found" = "$V" ] || { echo "${pair%%:*} is $found, expected $V" >&2; exit 1; }
          done
          grep -q "^version = \"$V\"" src-tauri/Cargo.toml || { echo "src-tauri/Cargo.toml is not $V" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # A copy released without the key's public half could never update itself.
      - name: The app carries the update key
        run: |
          node -e 'const c = require("./src-tauri/tauri.conf.json"); process.exit(c.plugins?.updater?.pubkey ? 0 : 1)' ||
            { echo "plugins.updater.pubkey is empty in tauri.conf.json: ci-secrets.sh tauri-key statim prints it" >&2; exit 1; }

      # A release whose tag GitHub lacks is made from GitHub's main, which the mirror then overwrites.
      - name: GitHub has the tag, at this commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for attempt in $(seq 60); do
            ref=$(gh api "repos/$RELEASES_REPOSITORY/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null || true)
            if [ "${ref%% *}" = tag ]; then
              ref="commit $(gh api "repos/$RELEASES_REPOSITORY/git/tags/${ref#* }" --jq .object.sha)"
            fi
            [ "${ref#* }" = "$GITHUB_SHA" ] && { echo "GitHub has $TAG at $GITHUB_SHA."; exit 0; }
            sleep 10
          done
          echo "After ten minutes GitHub's $TAG is '${ref:-missing}', not $GITHUB_SHA: is the push mirror to GitHub working?" >&2
          exit 1

      - name: Release notes
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            git log --no-merges --format='- %s' "$PREVIOUS..HEAD" > "$RUNNER_TEMP/all-notes"
            COUNT=$(wc -l < "$RUNNER_TEMP/all-notes")
            head -n 50 "$RUNNER_TEMP/all-notes" > "$RUNNER_TEMP/notes"
            [ "$COUNT" -le 50 ] || echo "- And $((COUNT - 50)) more changes" >> "$RUNNER_TEMP/notes"
          else
            echo "The first release of Statim." > "$RUNNER_TEMP/notes"
          fi
          cat "$RUNNER_TEMP/notes"

      - id: release
        name: Draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v$V"
          # Looking a release up by tag never finds a draft.
          release=$(gh api "repos/$RELEASES_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -1)
          if [ -n "$release" ]; then
            [ "${release#* }" = true ] || { echo "Statim $V is already published; this run would overwrite its files." >&2; exit 1; }
            id=${release%% *}
          else
            id=$(gh api "repos/$RELEASES_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Statim $V" \
              -F body=@"$RUNNER_TEMP/notes" -F draft=true -F prerelease=false --jq .id)
          fi
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "no release id: $id" >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: mac
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # actions/checkout adds a safe.directory to the global git config: a throwaway one, not Anthony's ~/.gitconfig.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Secrets are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_SIGNING_IDENTITY TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "The $name secret is not set." >&2; exit 1; }
          done

      - name: The Mac's tools
        run: |
          WORK=$(mktemp -d)
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          rustup install --no-self-update
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version
          # Whole outputs: `| head` would end a command early, and the pipe's SIGPIPE fails the step.
          xcodebuild -version; node --version; npm --version; gh --version

      - name: JavaScript packages
        run: npm ci

      - name: TDLib
        run: ./scripts/tdlib.sh desktop

      - name: Build the universal app, unsigned
        run: |
          npx tauri build --target universal-apple-darwin --bundles app --no-sign -- --locked
          APP="$PWD/src-tauri/target/universal-apple-darwin/release/bundle/macos/Statim.app"
          [ -d "$APP" ] || { echo "no app at $APP" >&2; exit 1; }
          found=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$found" = "$VERSION" ] || { echo "the app says $found, expected $VERSION" >&2; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$WORK/signing.keychain-db"
          PASS=$(openssl rand -hex 16)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$WORK/certificate.p12"
          security import "$WORK/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$WORK/certificate.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign inside out
        run: scripts/sign-macos.sh "$APP" "${{ secrets.APPLE_SIGNING_IDENTITY }}" "$KEYCHAIN"

      - name: DMG, notarized and stapled when NOTARIZE is on
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          # A repository variable, off until Apple's new developer agreement is accepted.
          NOTARIZE: ${{ vars.NOTARIZE }}
        run: |
          STAGE="$WORK/dmg"
          mkdir -p "$STAGE" && cp -R "$APP" "$STAGE/" && ln -s /Applications "$STAGE/Applications"
          DMG="$WORK/Statim-$VERSION.dmg"
          hdiutil create -volname Statim -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --keychain "$KEYCHAIN" --timestamp "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          if [ "$NOTARIZE" != true ]; then
            echo "Not notarized: NOTARIZE isn't true."
            exit 0
          fi
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$WORK/AuthKey.p8"
          xcrun notarytool submit "$DMG" --key "$WORK/AuthKey.p8" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait
          rm "$WORK/AuthKey.p8"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      # Packed without macOS's ._ files, which Tauri's updater would unpack over the app.
      - name: Update bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          UPDATE="$WORK/Statim_${VERSION}_universal.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$UPDATE" -C "$(dirname "$APP")" "$(basename "$APP")"
          npx tauri signer sign --app-version "$VERSION" "$UPDATE"
          [ -s "$UPDATE.sig" ] || { echo "no signature beside $UPDATE" >&2; exit 1; }
          # A copy signed with a key other than the one it carries never updates.
          key_id() { base64 -d | sed -n 2p | base64 -d | head -c 10 | tail -c 8 | xxd -p; }
          signed=$(key_id < "$UPDATE.sig")
          trusted=$(node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey' | key_id)
          [ "$signed" = "$trusted" ] || { echo "signed with key $signed, but the app trusts $trusted" >&2; exit 1; }
          echo "UPDATE=$UPDATE" >> "$GITHUB_ENV"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "v$VERSION" "$DMG" "$UPDATE" "$UPDATE.sig" --clobber --repo "$RELEASES_REPOSITORY"

      - name: Remove the signing keychain and the work folder
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          [ -n "${WORK:-}" ] && rm -rf "$WORK" || true

  linux:
    needs: prepare
    runs-on: home-linux
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # cmake for aws-lc, perl for OpenSSL, libudev for hidapi; flock because apt refuses a cache another job holds.
      - name: Linux packages and gh
        run: |
          # archive.ubuntu.com crawls from the home server and security.ubuntu.com doesn't answer: Ubuntu's French mirror.
          sudo sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu#http://fr.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo mkdir -p /cache/apt/archives/partial
          sudo apt-get update
          sudo flock /cache/apt/lock apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives=/cache/apt/archives \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake perl libudev-dev pkg-config patchelf xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-libav
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1

      # The Linux image has no rustup.
      - name: Rust
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup install --no-self-update
          cargo --version

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # The last release's bundles go first, or they'd be attached again.
      - name: Caches
        run: |
          target=/cache/target/statim/linux
          rm -rf "$target/release/bundle"
          {
            echo "CARGO_HOME=/cache/cargo"
            echo "CARGO_TARGET_DIR=$target"
            echo "npm_config_cache=/cache/npm"
          } >> "$GITHUB_ENV"

      - name: JavaScript packages
        run: npm ci

      - name: TDLib
        run: ./scripts/tdlib.sh desktop

      # Not tauri-action: the runner gives JavaScript actions git.laibe.cc's GITHUB_TOKEN, which GitHub refuses.
      - name: Build the deb, rpm and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy is an AppImage itself, and the job container has no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --config src-tauri/tauri.release.conf.json -- --locked

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          shopt -s nullglob
          bundle=$CARGO_TARGET_DIR/release/bundle
          files=("$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage)
          [ ${#files[@]} -eq 3 ] || { echo "the deb, rpm and AppImage weren't all built: ${files[*]}" >&2; exit 1; }
          for file in "${files[@]}"; do
            [ -f "$file.sig" ] || { echo "$file has no update signature" >&2; exit 1; }
          done
          gh release upload "v$VERSION" "${files[@]}" "${files[@]/%/.sig}" --clobber --repo "$RELEASES_REPOSITORY"

  windows:
    needs: prepare
    runs-on: windows
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # The perl OpenSSL's build runs (openssl-src reads PERL): Strawberry's, never the MSYS one in Git's bash.
      PERL: C:\Strawberry\perl\bin\perl.exe
      # Outside the job's folder, which the runner deletes, so crates and Tauri's WiX and NSIS stay between releases.
      CARGO_TARGET_DIR: C:\runner\target\statim
    defaults:
      run:
        # Git's bash: the runner's own default on Windows is PowerShell.
        shell: bash
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: The VM's tools
        run: |
          which bash node npm cargo gh nasm
          node --version; cargo --version; gh --version
          "$PERL" -v

      - name: JavaScript packages
        run: npm ci

      - name: TDLib
        run: ./scripts/tdlib.sh desktop

      # PowerShell keeps Git's MSYS tools out; useLocalToolsDir keeps WiX out of LocalSystem's redirected System32.
      - name: Build the MSI and NSIS installer
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # A file, not inline JSON: PowerShell 5.1 mangles quotes in arguments to programs. ASCII, so no BOM.
          '{"bundle":{"useLocalToolsDir":true}}' | Set-Content -Encoding ascii "$env:RUNNER_TEMP\local-tools.json"
          Remove-Item -Recurse -Force "$env:CARGO_TARGET_DIR\release\bundle" -ErrorAction SilentlyContinue
          npx tauri build --config src-tauri/tauri.release.conf.json --config "$env:RUNNER_TEMP\local-tools.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          shopt -s nullglob
          bundle="$(cygpath -u "$CARGO_TARGET_DIR")/release/bundle"
          files=("$bundle"/msi/*.msi "$bundle"/nsis/*-setup.exe)
          [ ${#files[@]} -eq 2 ] || { echo "the MSI and NSIS installer weren't both built: ${files[*]}" >&2; exit 1; }
          for file in "${files[@]}"; do
            [ -f "$file.sig" ] || { echo "$file has no update signature" >&2; exit 1; }
          done
          gh release upload "v$VERSION" "${files[@]}" "${files[@]/%/.sig}" --clobber --repo "$RELEASES_REPOSITORY"

  publish:
    needs: [prepare, macos, linux, windows]
    runs-on: home-linux
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE: repos/alaibe/statim/releases/${{ needs.prepare.outputs.release_id }}
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: gh
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1

      - name: The release's files
        run: |
          mkdir files && cd files
          gh api "$RELEASE/assets" --paginate \
            --jq '.[] | select(.name | test("\\.json$|^SHA256SUMS$") | not) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/$RELEASES_REPOSITORY/releases/assets/$id" > "$name"
            done
          ls -l
          [ "$(find . -maxdepth 1 -type f ! -name '*.sig' | wc -l)" -eq 7 ] ||
            { echo "expected the DMG, the Mac's update bundle, deb, rpm, AppImage, MSI and NSIS .exe" >&2; exit 1; }
          [ "$(find . -maxdepth 1 -type f -name '*.sig' | wc -l)" -eq 6 ] ||
            { echo "expected an update signature beside each of the six update files" >&2; exit 1; }

      - name: SHA256SUMS
        working-directory: files
        run: |
          find . -maxdepth 1 -type f ! -name '*.sig' -printf '%f\n' | sort | xargs sha256sum -- > "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"

      # FEED: each updater key, an installer's own before the bare one, and its file ({v} is the version).
      - name: latest.json
        working-directory: files
        env:
          FEED: |
            windows-x86_64 Statim_{v}_x64_en-US.msi
            windows-x86_64-msi Statim_{v}_x64_en-US.msi
            windows-x86_64-nsis Statim_{v}_x64-setup.exe
            linux-x86_64 Statim_{v}_amd64.AppImage
            linux-x86_64-appimage Statim_{v}_amd64.AppImage
            linux-x86_64-deb Statim_{v}_amd64.deb
            linux-x86_64-rpm Statim-{v}-1.x86_64.rpm
            darwin-aarch64 Statim_{v}_universal.app.tar.gz
            darwin-x86_64 Statim_{v}_universal.app.tar.gz
            darwin-universal Statim_{v}_universal.app.tar.gz
            darwin-aarch64-app Statim_{v}_universal.app.tar.gz
            darwin-x86_64-app Statim_{v}_universal.app.tar.gz
            darwin-universal-app Statim_{v}_universal.app.tar.gz
        run: |
          BASE="https://github.com/$RELEASES_REPOSITORY/releases/download/v$VERSION"
          platforms='{}'
          while read -r key name; do
            [ -n "$key" ] || continue
            file="${name//\{v\}/$VERSION}"
            [ -f "$file" ] && [ -f "$file.sig" ] || { echo "$file or its signature is missing" >&2; exit 1; }
            platforms=$(jq --arg key "$key" --arg url "$BASE/$file" --rawfile signature "$file.sig" \
              '. + {($key): {signature: $signature, url: $url}}' <<< "$platforms")
          done <<< "$FEED"
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --argjson platforms "$platforms" \
            '{version: $version, notes: "", pub_date: $date, platforms: $platforms}' > "$RUNNER_TEMP/latest.json"
          jq '.platforms | map_values(.url)' "$RUNNER_TEMP/latest.json"

      - name: Attach them
        run: gh release upload "v$VERSION" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/latest.json" --clobber --repo "$RELEASES_REPOSITORY"

      - name: Leave draft
        if: startsWith(github.ref, 'refs/tags/')
        run: gh api -X PATCH "$RELEASE" -F draft=false --silent

  homebrew:
    needs: [prepare, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: home-linux
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Move the cask to this release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C /usr/local --strip-components=1
          V="${{ needs.prepare.outputs.version }}"
          DMG="Statim-$V.dmg"
          curl -fsSL -o "$DMG" "https://github.com/$RELEASES_REPOSITORY/releases/download/v$V/$DMG"
          SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          gh repo clone alaibe/homebrew-tap tap -- --depth 1
          cat > tap/Casks/statim.rb <<EOF
          cask "statim" do
            version "$V"
            sha256 "$SHA"

            url "https://github.com/alaibe/statim/releases/download/v#{version}/Statim-#{version}.dmg"
            name "Statim"
            desc "Messenger for XMTP, Matrix, Telegram, Nostr and Status"
            homepage "https://statim.laibe.cc/"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true
            depends_on macos: :sequoia

            app "Statim.app"
            binary "#{appdir}/Statim.app/Contents/MacOS/statim"

            zap trash: [
              "~/Library/Application Support/im.statim.app",
              "~/Library/Caches/im.statim.app",
              "~/Library/Caches/statim",
              "~/Library/Preferences/im.statim.app.plist",
              "~/Library/WebKit/im.statim.app",
              "~/Library/WebKit/statim",
            ]
          end
          EOF
          cat tap/Casks/statim.rb
          gh auth setup-git
          git -C tap add Casks/statim.rb
          git -C tap -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "statim $V"
          git -C tap push

  aur:
    needs: [prepare, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: home-linux
    timeout-minutes: 20
    # makepkg runs on Arch itself: the job container can't run Docker.
    container:
      image: archlinux:latest
    steps:
      - env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          [ -n "$AUR_SSH_PRIVATE_KEY" ] || { echo "No AUR key yet; statim-bin stays as it is."; exit 0; }
          V="${{ needs.prepare.outputs.version }}"
          pacman -Sy --noconfirm --needed git openssh pacman-contrib base-devel > /dev/null
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/statim-bin.git aur
          sed -i -E "s/^pkgver=.*/pkgver=$V/; s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          # makepkg won't run as root.
          useradd -m b && chown -R b aur
          su b -c "cd aur && updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git config --global --add safe.directory "$PWD/aur"
          git -C aur -c user.name="Anthony Laibe" -c user.email="anthony@laibe.cc" commit -am "statim $V"
          git -C aur push

  # On the Mac for its EAS login and Android SDK.
  android:
    needs: [prepare, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: mac
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      JAVA_HOME: /opt/homebrew/opt/openjdk@21
    steps:
      # actions/checkout adds a safe.directory to the global git config: a throwaway one, not Anthony's ~/.gitconfig.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: JavaScript packages
        run: npm ci

      - name: Build the Android bundle and send it to Google Play
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          eas whoami
          AAB="$(mktemp -d)/statim-$VERSION.aab"
          trap 'rm -rf "$(dirname "$AAB")"' EXIT
          eas build --local --non-interactive --platform android --profile production --output "$AAB"
          eas submit --non-interactive --no-wait --platform android --profile production --path "$AAB"

  # IOS stays off until Apple's new developer agreement is accepted.
  ios:
    needs: [prepare, publish]
    if: startsWith(github.ref, 'refs/tags/') && vars.IOS == 'true'
    runs-on: mac
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      # actions/checkout adds a safe.directory to the global git config: a throwaway one, not Anthony's ~/.gitconfig.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: JavaScript packages
        run: npm ci

      - name: Build the iPhone app and send it to TestFlight
        run: |
          eas whoami
          IPA="$(mktemp -d)/statim-$VERSION.ipa"
          trap 'rm -rf "$(dirname "$IPA")"' EXIT
          eas build --local --non-interactive --platform ios --profile production --output "$IPA"
          eas submit --non-interactive --no-wait --platform ios --profile production --path "$IPA"
