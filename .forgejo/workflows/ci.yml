name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SHELLCHECK_VERSION: 0.11.0
  SHFMT_VERSION: 3.14.1

jobs:
  check:
    # nightly.yml checked its own version commit just before making it.
    if: ${{ github.event.head_commit.author.email != 'nightly@git.laibe.cc' }}
    runs-on: home-linux
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # cmake for aws-lc, perl for OpenSSL, libudev for hidapi; flock because apt refuses a cache another job holds.
      - name: Linux packages
        run: |
          # archive.ubuntu.com crawls from the home server and security.ubuntu.com doesn't answer: Ubuntu's French mirror.
          sudo sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu#http://fr.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo mkdir -p /cache/apt/archives/partial
          sudo apt-get update
          sudo flock /cache/apt/lock apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives=/cache/apt/archives \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake perl libudev-dev pkg-config patchelf xdg-utils

      # The Linux image has no rustup.
      - name: Rust
        run: |
          if ! command -v rustup > /dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup install --no-self-update
          cargo --version

      - name: Tools
        uses: https://github.com/taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: shellcheck@${{ env.SHELLCHECK_VERSION }},shfmt@${{ env.SHFMT_VERSION }}

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # CARGO_HOME is set only now, so rustup's and install-action's binaries stay in the job's ~/.cargo.
      - name: Caches
        run: |
          {
            echo "CARGO_HOME=/cache/cargo"
            echo "CARGO_TARGET_DIR=/cache/target/statim/check"
            echo "npm_config_cache=/cache/npm"
          } >> "$GITHUB_ENV"

      - name: JavaScript packages
        run: npm ci

      # tauri-build checks that the bundled TDLib is there.
      - name: TDLib
        run: ./scripts/tdlib.sh desktop

      - name: Shell scripts
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            if [ -f "$file" ] && head -c 40 "$file" | grep -qE '^#!.*(bash|/sh)'; then printf '%s\0' "$file"; fi
          done > "$RUNNER_TEMP/shell"
          tr '\0' '\n' < "$RUNNER_TEMP/shell"

      - name: Format
        run: |
          xargs -0 -r shfmt -d -i 4 -ci -bn < "$RUNNER_TEMP/shell"
          npm run format:check

      - name: Lint
        run: |
          xargs -0 -r shellcheck -S warning < "$RUNNER_TEMP/shell"
          xargs -0 -r -n 1 bash -n < "$RUNNER_TEMP/shell"
          npm run lint
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  swift:
    if: ${{ github.event.head_commit.author.email != 'nightly@git.laibe.cc' }}
    runs-on: home-linux
    # Swift 6.4, as Xcode's swift-format on the Mac; the slim images have no toolchain.
    container:
      image: swift:6.4.2-noble
    timeout-minutes: 15
    steps:
      # The image has git but not the Node actions/checkout runs on.
      - name: Node
        run: |
          # archive.ubuntu.com crawls from the home server and security.ubuntu.com doesn't answer: Ubuntu's French mirror.
          sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu#http://fr.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs > /dev/null

      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint
        run: |
          swift format --version
          swift format lint --strict --recursive .
