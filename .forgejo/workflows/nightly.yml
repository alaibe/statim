# Releases Statim every night when main has commits since the last release, as Grenier's and Kestrel's nightlies do.
#
# On the home runner, `due` counts the commits since the last `v*` tag that change the app (not only the workflows,
# docs/ or the top-level notes); with none, the run ends there. Otherwise the Mac runs the type check, the tests (Jest,
# then the desktop crate's) and the iPhone end-to-end suite, moves a version that's already tagged to its next patch in
# its six files and commits it, then tags `v<version>` and pushes both over SSH with the Mac's own key. A tag pushed with the job's own token starts no workflow; this one
# starts release.yml. Its "Run workflow" button does the same at once.
#
# 07:30 in Paris all year (the TZ= prefix: Forgejo reads a bare cron as UTC). Statim goes last, after Grenier's 05:30
# and Kestrel's 06:30, because its release takes 45 to 85 minutes and the Windows VM's build is its longest part.

name: Nightly release

on:
  schedule:
    - cron: 'TZ=Europe/Paris 30 7 * * *'
  workflow_dispatch:

# One run at a time, never cancelled: a cancelled one could stop between its version commit and its tag.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  ORIGIN: ssh://git@git.laibe.cc:2222/anthony/statim.git

jobs:
  due:
    runs-on: home-linux
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: due
        name: Commits since the last release
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          COUNT=$(git rev-list --count "$LAST..HEAD")
          # Commits that only touch the workflows, docs/ or the top-level notes (README.md, AGENTS.md…) make no release.
          APP=$(git rev-list --count "$LAST..HEAD" -- . ':(exclude).forgejo' ':(exclude).github' ':(exclude)docs' ':(exclude,glob)*.md')
          echo "$COUNT commits since $LAST, $APP of them changing the app"
          if [ "$APP" -gt 0 ]; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi

  tag:
    needs: due
    if: needs.due.outputs.due == 'true'
    runs-on: mac
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      # actions/checkout adds a safe.directory to the global git config: a throwaway one, not Anthony's ~/.gitconfig.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig

      # The Rust in rust-toolchain.toml, through the Mac's own rustup, as release.yml's macos job.
      - name: Rust
        run: |
          rustup install --no-self-update
          cargo --version

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: JavaScript packages
        run: npm ci

      # The desktop's TDLib, which tauri-build checks is there, and the iPhone's, which the e2e build links. Both are
      # cached in ~/.cache/statim from one run to the next.
      - name: TDLib
        run: |
          ./scripts/tdlib.sh desktop
          ./scripts/tdlib.sh ios

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          rm -rf src-tauri/target

      # e2e/run.sh against a development build of this commit, on a simulator kept for it from one night to the next
      # (so 00-onboarding makes its account once, not every night) and a Metro on a port of its own, away from the
      # simulators and servers in use on the Mac. Whatever the result, Metro stops, the simulator shuts down, and Xcode's
      # build of this checkout goes: its DerivedData folder is named after the checkout's path, a new one every night.
      - name: E2e
        env:
          E2E_METRO_PORT: '8090'
          SIMULATOR: Statim nightly
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          UDID=$(xcrun simctl list devices -j | jq -r --arg name "$SIMULATOR" '[.devices[][] | select(.name == $name)][0].udid // empty')
          [ -n "$UDID" ] || UDID=$(xcrun simctl create "$SIMULATOR" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro)
          METRO=
          clean() {
            [ -z "$METRO" ] || kill "$METRO"
            xcrun simctl shutdown "$UDID" || true
            for built in "$HOME"/Library/Developer/Xcode/DerivedData/Statim-*; do
              if grep -qF "$PWD/" "$built/info.plist" 2> /dev/null; then rm -rf "$built"; fi
            done
          }
          trap clean EXIT
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          ./node_modules/.bin/expo start --dev-client --port "$E2E_METRO_PORT" > "$RUNNER_TEMP/metro.log" 2>&1 &
          METRO=$!
          for _ in $(seq 90); do
            curl -sf -m 5 "http://localhost:$E2E_METRO_PORT/status" > /dev/null && break
            sleep 2
          done
          curl -sf -m 5 "http://localhost:$E2E_METRO_PORT/status" > /dev/null || { tail -n 50 "$RUNNER_TEMP/metro.log"; exit 1; }
          # With this project's Metro already on the port, run:ios builds, installs and opens the app on it, and exits.
          npx expo run:ios --device "$UDID" --port "$E2E_METRO_PORT"
          E2E_DEVICE="$UDID" ./e2e/run.sh ios || { tail -n 50 "$RUNNER_TEMP/metro.log"; exit 1; }

      - name: Version, commit and tag
        run: |
          [ -z "$(git status --porcelain)" ] || { git status --short; echo "the checkout isn't clean" >&2; exit 1; }
          V=$(jq -r .expo.version app.json)
          if git rev-parse -q --verify "refs/tags/v$V" > /dev/null; then
            NEXT="${V%.*}.$((${V##*.} + 1))"
            FILES="app.json package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock"
            perl -pi -e "s/^(    \"version\": \")\Q$V\E\"/\${1}$NEXT\"/" app.json
            perl -pi -e "s/^(  \"version\": \")\Q$V\E\"/\${1}$NEXT\"/" package.json src-tauri/tauri.conf.json
            perl -0pi -e "s/(\"name\": \"statim\",\s+\"version\": \")\Q$V\E\"/\${1}$NEXT\"/g" package-lock.json
            perl -0pi -e "s/^(\[package\]\nname = \"statim\"\nversion = \")\Q$V\E\"/\${1}$NEXT\"/m" src-tauri/Cargo.toml
            perl -0pi -e "s/^(name = \"statim\"\nversion = \")\Q$V\E\"/\${1}$NEXT\"/m" src-tauri/Cargo.lock
            for pair in app.json:.expo.version package.json:.version 'package-lock.json:.packages[""].version' \
              package-lock.json:.version src-tauri/tauri.conf.json:.version; do
              found=$(jq -r "${pair#*:}" "${pair%%:*}")
              [ "$found" = "$NEXT" ] || { echo "${pair%%:*} still says $found" >&2; exit 1; }
            done
            grep -q "^version = \"$NEXT\"" src-tauri/Cargo.toml || { echo "src-tauri/Cargo.toml isn't $NEXT" >&2; exit 1; }
            grep -A1 '^name = "statim"$' src-tauri/Cargo.lock | grep -q "^version = \"$NEXT\"" \
              || { echo "src-tauri/Cargo.lock isn't $NEXT" >&2; exit 1; }
            [ "$(git diff --numstat -- $FILES | wc -l)" -eq 6 ] || { git diff --stat; echo "not all six files moved" >&2; exit 1; }
            git add $FILES
            git -c user.name="Statim nightly" -c user.email="nightly@git.laibe.cc" commit -q -m "Release $NEXT"
            git push "$ORIGIN" HEAD:main
            V=$NEXT
          fi
          git tag "v$V"
          git push "$ORIGIN" "v$V"
          echo "Tagged v$V: release.yml builds it."
