name: Store screenshots

# Captures the App Store's screenshots from a Release build of main and commits them to store/ios.
on:
  workflow_dispatch:

concurrency:
  group: store-screenshots
  cancel-in-progress: false

env:
  ORIGIN: ssh://git@git.laibe.cc:2222/anthony/statim.git

jobs:
  ios:
    runs-on: mac
    timeout-minutes: 90
    steps:
      # actions/checkout adds a safe.directory to the global git config: a throwaway one, not Anthony's ~/.gitconfig.
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig

      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: JavaScript packages
        run: npm ci

      - name: TDLib
        run: ./scripts/tdlib.sh ios

      # Release bundles the JavaScript, so the app runs without Metro.
      - name: Build
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          npx expo prebuild --platform ios
          xcodebuild -workspace ios/Statim.xcworkspace -scheme Statim -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/xcode" \
            COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -m 20 'error:' "$RUNNER_TEMP/xcodebuild.log"; tail -n 40 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Capture
        run: store/capture.sh ios "$RUNNER_TEMP/xcode/Build/Products/Release-iphonesimulator/Statim.app"

      - name: Commit
        run: |
          git add store/ios
          if git diff --cached --quiet; then
            echo "The screenshots haven't changed."
            exit 0
          fi
          git -c user.name="Statim store screenshots" -c user.email="nightly@git.laibe.cc" \
            commit -q -m "App Store screenshots of $(git rev-parse --short HEAD)"
          git push "$ORIGIN" HEAD:main
